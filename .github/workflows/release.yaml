name: clustertool-go-release

on:
  push:
    tags:
      - "v*"
    paths:
      - "clustertool/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            clustertool/go.mod
            clustertool/go.sum

      # ------------------------------------------------------------
      # IMPORTANT PART: prepare embed assets BEFORE go build
      # ------------------------------------------------------------
      - name: Prepare embed assets (talosctl binaries)
        shell: bash
        run: |
          set -euxo pipefail
          cd clustertool
          chmod +x partial_builds/partial_build.sh
          chmod +x embed/download_talosctl.sh
          bash partial_builds/partial_build.sh
          bash embed/download_talosctl.sh

      # ------------------------------------------------------------
      # Run GoReleaser using the clustertool config
      # ------------------------------------------------------------
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config clustertool/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
