name: clustertool-go-release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
on:
  push:
    tags:
      - "*"
    paths:
      - 'clustertool/**'
jobs:
  goreleaser:
    runs-on: actions-runners
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      # - name: Install Syft
      #   run: sudo curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          args: release --clean
          distribution: goreleaser # or 'goreleaser-pro'
          version: "~> v2" # or 'latest', 'nightly', semver
        env:
          # GITHUB_TOKEN: "${{ secrets.BOT_TOKEN }}"   ## CHANGED FROM UPSTREAM
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
